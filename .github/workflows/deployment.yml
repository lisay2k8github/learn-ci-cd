name: Deploy Project
on: push
jobs:
  test:
    # The environment has easy access to the code, but they do not run inside it.
    # Instead, the code could be just a folder that sits on a machine owned by GitHub.
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
        # Install dependencies
        # node.js is already pre-installed by default
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      # Install project dependencies in package.json
      - name: Install dependencies
        run: npm ci # More specific version of npm install
      # Run tests
      - name: Run tests
        run: npm test
  # Important: Every job runs on its own environment.
  # Without the needs property, the jobs run in parallel.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
        # Install dependencies
        # node.js is already pre-installed by default
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      # Install project dependencies in package.json
      - name: Install dependencies
        run: npm ci # More specific version of npm install
      # Build project. The code served is not the source code.
      - name: Build project
        run: npm run build
      # Deploy project
      - name: Deploy
        run: echo "Deploying..."

